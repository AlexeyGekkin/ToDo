<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ToDo App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #f4f4f5);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #000000);
            --hint: var(--tg-theme-hint-color, #8e8e93);
            --button: var(--tg-theme-button-color, #007aff);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            padding-bottom: 70px;
        }

        .header {
            padding: 16px;
            background: var(--card-bg);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }

        .tab-content { display: none; padding: 16px; }
        .tab-content.active { display: block; }

        /* Фильтры задач */
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .filter-btn {
            flex: 1;
            padding: 8px;
            border: none;
            background: var(--card-bg);
            color: var(--text);
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .filter-btn.active {
            background: var(--button);
            color: var(--button-text);
            font-weight: bold;
        }

        /* Список задач */
        .task-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .task-info { flex-grow: 1; margin-left: 12px; }
        .task-title { font-size: 16px; font-weight: 500; }
        .task-title.completed { text-decoration: line-through; color: var(--hint); }
        .task-meta { font-size: 12px; color: var(--hint); margin-top: 4px; }

        .checkbox {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid var(--hint);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .checkbox.checked {
            background: var(--button);
            border-color: var(--button);
            color: var(--button-text);
        }

        /* Форма создания */
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: var(--hint); margin-bottom: 6px; }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 10px;
            background: var(--card-bg);
            color: var(--text);
            box-sizing: border-box;
            font-size: 16px;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--button);
            color: var(--button-text);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Нижняя панель навигации */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--card-bg);
            display: flex;
            border-top: 1px solid rgba(0,0,0,0.05);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--hint);
            cursor: pointer;
        }
        .nav-item.active { color: var(--button); font-weight: bold; }
        .nav-item span { font-size: 20px; margin-bottom: 2px; }

        /* Профиль */
        .stat-box {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <div class="header" id="headerTitle">Мои задачи</div>

    <!-- Вкладка 1: Список задач -->
    <div id="tab-tasks" class="tab-content active">
        <div class="filters">
            <button class="filter-btn active" onclick="setFilter('today')">Сегодня</button>
            <button class="filter-btn" onclick="setFilter('week')">Неделя</button>
            <button class="filter-btn" onclick="setFilter('all')">Все</button>
        </div>
        <div id="tasksList">Загрузка...</div>
    </div>

    <!-- Вкладка 2: Создать задачу -->
    <div id="tab-create" class="tab-content">
        <form id="todoForm">
            <div class="form-group">
                <label>Название *</label>
                <input type="text" id="title" required placeholder="Например: Сдать отчёт">
            </div>
            <div class="form-group">
                <label>Описание</label>
                <textarea id="description" rows="2" placeholder="Заметки..."></textarea>
            </div>
            <div class="form-group">
                <label>Дедлайн</label>
                <input type="datetime-local" id="due_date">
            </div>
            <div class="form-group">
                <label>Напоминание</label>
                <select id="reminder_type">
                    <option value="">Без напоминания</option>
                    <option value="morning">☀️ Утренний дайджест</option>
                    <option value="deadline">⏰ В дедлайн</option>
                    <option value="both">🔔 И утром, и в дедлайн</option>
                </select>
            </div>
            <button type="submit" class="submit-btn">Сохранить</button>
        </form>
    </div>

    <!-- Вкладка 3: Профиль -->
    <div id="tab-profile" class="tab-content">
        <div class="stat-box">
            <div style="font-size: 14px; color: var(--hint);">Пользователь</div>
            <div id="profEmail" style="font-size: 18px; font-weight: bold; margin-top: 4px;">-</div>
        </div>
        <div class="stat-box">
            <div style="font-size: 14px; color: var(--hint);">Активных задач</div>
            <div id="profActive" style="font-size: 24px; font-weight: bold; color: var(--button); margin-top: 4px;">0</div>
        </div>
        <div class="stat-box">
            <div style="font-size: 14px; color: var(--hint);">Выполнено</div>
            <div id="profCompleted" style="font-size: 24px; font-weight: bold; margin-top: 4px;">0</div>
        </div>
    </div>

    <!-- Навигация -->
    <div class="nav-bar">
        <div class="nav-item active" onclick="switchTab('tasks')">
            <span>📋</span>Задачи
        </div>
        <div class="nav-item" onclick="switchTab('create')">
            <span>➕</span>Создать
        </div>
        <div class="nav-item" onclick="switchTab('profile')">
            <span>👤</span>Профиль
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let allTodos = [];
        let currentFilter = 'today';

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            if (tabName === 'tasks') {
                document.getElementById('tab-tasks').classList.add('active');
                document.querySelectorAll('.nav-item')[0].classList.add('active');
                document.getElementById('headerTitle').innerText = 'Мои задачи';
                loadTasks();
            } else if (tabName === 'create') {
                document.getElementById('tab-create').classList.add('active');
                document.querySelectorAll('.nav-item')[1].classList.add('active');
                document.getElementById('headerTitle').innerText = 'Новая задача';
            } else if (tabName === 'profile') {
                document.getElementById('tab-profile').classList.add('active');
                document.querySelectorAll('.nav-item')[2].classList.add('active');
                document.getElementById('headerTitle').innerText = 'Профиль';
                loadProfile();
            }
        }

        async function loadTasks() {
            try {
                const res = await fetch(`/api/telegram/todos?init_data=${encodeURIComponent(tg.initData)}`);
                if (!res.ok) throw new Error();
                allTodos = await res.json();
                renderTasks();
            } catch (e) {
                document.getElementById('tasksList').innerHTML = '<div style="text-align:center; color:var(--hint);">Ошибка загрузки</div>';
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderTasks();
        }

        function renderTasks() {
            const list = document.getElementById('tasksList');
            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];

            let filtered = allTodos.filter(t => {
                if (currentFilter === 'all') return true;
                if (!t.due_date) return currentFilter === 'all';
                const taskDateStr = new Date(t.due_date).toISOString().split('T')[0];
                if (currentFilter === 'today') return taskDateStr === todayStr;
                if (currentFilter === 'week') {
                    const diffDays = (new Date(t.due_date) - now) / (1000 * 3600 * 24);
                    return diffDays >= -1 && diffDays <= 7;
                }
                return true;
            });

            if (filtered.length === 0) {
                list.innerHTML = '<div style="text-align:center; padding: 20px; color:var(--hint);">Задач нет 🥳</div>';
                return;
            }

            list.innerHTML = filtered.map(t => `
                <div class="task-card">
                    <div class="checkbox ${t.completed ? 'checked' : ''}" onclick="toggleTask(${t.id}, ${!t.completed})">
                        ${t.completed ? '✓' : ''}
                    </div>
                    <div class="task-info">
                        <div class="task-title ${t.completed ? 'completed' : ''}">${t.title}</div>
                        ${t.due_date ? `<div class="task-meta">⏰ ${new Date(t.due_date).toLocaleString([], {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'})}</div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        async function toggleTask(id, completed) {
            await fetch(`/api/telegram/todos/${id}?init_data=${encodeURIComponent(tg.initData)}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ completed: completed })
            });
            loadTasks();
        }

        async function loadProfile() {
            const res = await fetch(`/api/telegram/profile?init_data=${encodeURIComponent(tg.initData)}`);
            if (res.ok) {
                const p = await res.json();
                document.getElementById('profEmail').innerText = p.email;
                document.getElementById('profActive').innerText = p.active_count;
                document.getElementById('profCompleted').innerText = p.completed_count;
            }
        }

        document.getElementById('todoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const dueDate = document.getElementById('due_date').value;
            const payload = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value || null,
                due_date: dueDate ? new Date(dueDate).toISOString() : null,
                reminder_type: document.getElementById('reminder_type').value || null,
                init_data: tg.initData
            };

            const res = await fetch('/api/telegram/todos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                document.getElementById('todoForm').reset();
                switchTab('tasks');
            }
        });

        // Старт
        loadTasks();
    </script>
</body>
</html>
